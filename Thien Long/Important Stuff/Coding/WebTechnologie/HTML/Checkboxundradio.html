<html>
<head>
<title> auswahlbox </title>
</head>
<body>

<h1> Checkbox </h1>
<form>
<p>
Was möchten Sie Bestellen
</p>
   <input type="checkbox" name="Typ" value="Typ1"> Fleisch
   <input type="checkbox" name="Typ" value="Typ2"> Döner
   <input type="checkbox" name="Typ" value="Typ3"> Gurke
   <input type="checkbox" name="Typ" value="Typ4"> Wurst
</form>
<h1> Radio </h1>
<form>
<p>
Wählen Sie was an
</p>
   <input type="radio" name="marke" value="marke1"> Fisch
   <input type="radio" name="marke" value="marke2"> Sushi
   <input type="radio" name="marke" value="marke3"> Keks

</form>
<h1> Auswahlliste </h1>
<form>
<p>
Ihre Auswahl
</p>
<select name="Stadt" size=14>
  <option selected value="1"> Krefeld
  <option value="2"> Köln
  <option value="3"> Tokio
  <option value="4"> München
  <option value="5"> Düsseldorf
  <option value="6"> Münchengladbach
  <option value="7"> Dubai
  <option value="8"> Paris
  <option value="9"> Berlin
  <option value="10"> Viersen
</select>
</form>
<h1> Formular </h1>
<form>
Name: <input name="gehalt" size="60">
<input type="submit" value="Daten senden">
<input type="submit" value="Daten löschen">
</form>
<form>
<P>
Geschlecht
</p>
<input type="radio" name="marke" value="marke1" checked> männlich<br>
<input type="radio" name="marke" value="marke1" checked> weiblich<br>
</form>
<form>
<p>
alter:
</p>
   <input type="checkbox" name="Typ" value="Typ1" checked> unter 18<br>
   <input type="checkbox" name="Typ" value="Typ2" checked> über 18<br>
</form>
<form>
<p>
Feedback
</p>
<textarea name="Feedback" rows=10 cols=40> </textarea><br>
<input type="submit" value="Daten senden">
<input type="submit" value="Daten löschen">
</form>

</body>
</html>
