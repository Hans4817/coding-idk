<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let EUR, Dong;
        Dong = prompt("Geben Sie DONG ein: ");
        EUR = (Dong*1)/30033 //1 EUR ≈ 30033 VND.
        document.write(Dong + " Dong = " + EUR + " EUR");
    </script>
</body>
