<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let x = parseFloat(prompt("Geben Sie zahl ein: "));

        for(let i = 1; i <= x; i++) {
            let result = i * i;
            document.write(i +"² = " + result + "<br>");
        }
    </script>
</body>
</html>
