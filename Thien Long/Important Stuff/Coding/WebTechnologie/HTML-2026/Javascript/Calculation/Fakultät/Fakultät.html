<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let fakultaet = parseInt(prompt("Bitte geben Sie Fakultät ein: "));

        let result = 1;
        for(let i = 1; i <= fakultaet; i++) {
            result = result *  i;  
            document.write(i + "!" + " = " + result + "<br>");
        }
    </script>
</body>
</html>
