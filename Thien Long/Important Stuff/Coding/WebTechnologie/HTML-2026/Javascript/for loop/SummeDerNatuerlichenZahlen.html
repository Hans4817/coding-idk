<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>
	<script>
	let input, result = 0;
	input = prompt("Bitte geben Sie eine Zahl ein: ");
	let i;
	for(i = 1; i <= Number(input)-1; i++) {
		result += i;
		document.write(i + " + ");
	}
	result += i;
	document.write(i + " = " + result);
	</script>
</body>
</html>
