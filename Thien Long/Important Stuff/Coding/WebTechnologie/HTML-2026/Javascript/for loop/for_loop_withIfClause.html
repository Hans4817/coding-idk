<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>
	<script>
	var input, result = 0;
	input = prompt("Geben Sie eine Zahl ein: ");

	for(var i = 1; i <= Number(input); i++) {
		result = result + i;
		if(i == Number(input)) {
			document.write(i);
		}
		else {
			document.write(i + " + ");
		}
	}
	document.write(" = " + result);
	</script>
</body>
</html>
