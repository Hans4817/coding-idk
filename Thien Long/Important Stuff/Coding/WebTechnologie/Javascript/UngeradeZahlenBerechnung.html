<body>
<h1> Berechnung der Summe der ungeraden Zahlen mit Forschleife. </h1>
<script type="text/javascript">
var i;
var s=0;
var n;
n = prompt("Geben sie das Gewünschte Zahl. :", "");
for ( i = 1; i <= n; i=i+2){
s=s+i;
}
document.write("Hier sind ihre Summe. 1+3+5+...+" +n +" =" +s);




</script>
