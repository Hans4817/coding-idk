<html>
<head>
<title> if-else-Anweisung </title>
</head>
<body>
<h1>Zugangscode identifizieren</h1>
<script type="text/javascript">
var eingabe1,eingabe2,echte1,echte2;
echte1 = "Long";
echte2 = "Chau";
eingabe1=prompt("Geben sie ihr Vorname ein.");
eingabe2=prompt("Geben sie ihr Nachname ein.");
if (eingabe1  == echte1 & eingabe2 == echte2) {
document.write("Zugang gewaehrt"+"<br>");
document.write("Ihr Passwort war richtig."+"<br>");
}
else {
document.write("Ihr Vorname und Nachname ist falsch."+"<br>");
document.write("Moechten sie noch einen Versuch haben, bitte F5 druecken"+"<br>");
}



</script>




</body>
</html>
