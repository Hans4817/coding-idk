<body>
<h1>Zinseszins</h1>
<script type="text/javascript">
var ko=prompt("Wie viel Geld Wollen sie Anlegen");
var p=prompt("Sie bekommen denn Zinssatz:");
var n=prompt("Wie viele Jahre wollen sie Ihr Geld anlegen");
var kn;
for (var i=1; i<=n; i++) {
kn=ko=ko*(1+(p/100));
document.write("Nach "+i+" Jahren haben Sie =" + kn+" €"+"<br>");
}

</script>
