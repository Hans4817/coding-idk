	<h1>Ägypten: Die Entstehung</h1>
	<h2>* Wie ist das Land Ägypten entstanden?</h2>
	<p>Die Entstehung des Alten Ägypten begann um 3000 v. Chr. mit der Zusammenführung von Unter- und Oberägypten durch den Häuptling Menes. Er vereinigte die Gebiete, übernahm Oberägypten und ernannte sich zum König.</p>
